<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <title>CMS · Sin-Presupuesto</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>

  /* ══════════════════════════════════════════════════════════
     CSS GLOBAL DEL PREVIEW — idéntico al sitio real
  ══════════════════════════════════════════════════════════ */
  const previewCSS = `
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap');

    :root {
      --bg:#f0f4fa; --bg2:#ffffff; --bg3:#e4ecf7; --border:#c5d4eb;
      --accent:#1a3a6b; --accent2:#2e6fc4; --text:#1a2640; --muted:#5a6e8a;
      --shadow:rgba(26,58,107,.09); --green:#1db97d; --green-bg:#e8f9f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
      padding: 1.25rem;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex; align-items: center; gap: .85rem;
      margin-bottom: 1.25rem;
    }
    .ph-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--bg3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0;
    }
    .page-header h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.4rem; font-weight: 700; color: var(--accent2);
    }
    .page-label {
      font-size: .7rem; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted);
    }
    .page-intro {
      font-size: .88rem; color: var(--muted);
      margin-bottom: 1.25rem; line-height: 1.6;
      padding: .65rem 1rem;
      background: var(--bg3);
      border-left: 3px solid var(--accent2);
      border-radius: 0 10px 10px 0;
    }

    /* ── GRID ── */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    /* ── MODULE CARD ── */
    .module-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: box-shadow .22s;
      cursor: pointer;
    }
    .module-card:hover { box-shadow: 0 6px 20px var(--shadow); }
    .module-card.complete { border-color: rgba(29,185,125,.4); }

    .mc-head {
      display: flex; align-items: center; gap: .75rem;
      padding: .85rem 1rem;
      background: var(--bg2);
    }
    .mc-head:hover { background: var(--bg3); }

    .mc-emoji {
      width: 38px; height: 38px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .mc-title-wrap { flex: 1; min-width: 0; }
    .mc-title {
      font-family: 'Fraunces', serif;
      font-size: .92rem; font-weight: 700; color: var(--accent2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mc-desc {
      font-size: .7rem; color: var(--muted);
      margin-top: .02rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .mc-prog { height: 3px; background: var(--border); }
    .mc-prog-fill { height: 100%; background: var(--accent2); }

    /* ── FILES (expandido siempre en preview) ── */
    .mc-files {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .5rem;
      padding: .6rem .9rem .9rem;
    }
    .file-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: .65rem .75rem;
      display: flex; align-items: flex-start; gap: .55rem;
    }
    .file-card:hover {
      border-color: var(--accent2);
      box-shadow: 0 3px 14px var(--shadow);
    }
    .fc-icon {
      width: 30px; height: 30px; border-radius: 7px;
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; font-size: .95rem;
      background: var(--bg2);
    }
    .fc-body { flex: 1; min-width: 0; }
    .fc-name {
      font-size: .78rem; font-weight: 600; color: var(--accent2);
      line-height: 1.3; margin-bottom: .18rem;
    }
    .fc-tag {
      display: inline-block; padding: .03rem .35rem;
      background: var(--bg2); border-radius: 20px;
      font-size: .64rem; font-weight: 600; color: var(--accent2);
    }
    .fc-ext {
      font-size: .62rem; color: var(--muted);
      background: var(--bg2); border-radius: 20px;
      padding: .03rem .35rem; margin-left: .2rem;
    }
    .no-files {
      font-size: .75rem; color: var(--muted);
      font-style: italic; padding: .5rem .9rem .9rem;
    }

    /* ── COUNT BADGE ── */
    .mod-count {
      font-size: .65rem; font-weight: 600; color: var(--muted);
      background: var(--bg3); border-radius: 20px;
      padding: .15rem .5rem; flex-shrink: 0;
    }

    /* ── SECTION PREVIEW (index) ── */
    .preview-section-label {
      font-size: .62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
      margin: 1.25rem 0 .6rem;
    }
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: .75rem;
    }
    .section-card {
      background: var(--bg2); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 1rem;
      display: flex; flex-direction: column; gap: .35rem;
      transition: all .17s;
    }
    .section-card:hover {
      border-color: var(--accent2);
      box-shadow: 0 4px 16px var(--shadow);
      transform: translateY(-2px);
    }
    .sc-num {
      font-family: 'Fraunces', serif; font-size: .72rem;
      color: var(--accent2); font-weight: 300;
    }
    .sc-title {
      font-family: 'Fraunces', serif; font-size: .9rem;
      font-weight: 700; color: var(--accent);
    }
    .sc-total {
      font-size: .7rem; color: var(--muted);
    }
    .sc-img {
      width: 32px; height: 32px; object-fit: contain;
      border-radius: 6px; align-self: flex-end; margin-top: auto;
    }

    /* ── WIDGETS PREVIEW ── */
    .widget-wrap {
      display: flex; flex-direction: column; gap: .85rem;
    }
    .widget-card {
      background: var(--bg2); border: 1.5px solid var(--border);
      border-radius: 14px; overflow: hidden;
      position: relative;
    }
    .widget-type-badge {
      position: absolute; top: .6rem; right: .6rem;
      font-size: .6rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; padding: .18rem .5rem;
      border-radius: 20px; background: var(--bg3); color: var(--muted);
    }

    /* Banner */
    .w-banner {
      padding: 1.25rem 1.5rem;
      border-left: 4px solid var(--accent2);
    }
    .w-banner-title {
      font-family: 'Fraunces', serif; font-size: 1.1rem;
      font-weight: 700; color: var(--accent); margin-bottom: .3rem;
    }
    .w-banner-text { font-size: .85rem; color: var(--muted); }
    .w-banner-link {
      display: inline-flex; align-items: center; gap: .35rem;
      margin-top: .6rem; font-size: .78rem; font-weight: 600;
      color: var(--accent2); text-decoration: none;
    }

    /* Link card */
    .w-link {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem 1.25rem;
    }
    .w-link-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--bg3); display: flex; align-items: center;
      justify-content: center; font-size: 1.4rem; flex-shrink: 0;
    }
    .w-link-title {
      font-family: 'Fraunces', serif; font-size: .95rem;
      font-weight: 700; color: var(--accent2);
    }
    .w-link-url {
      font-size: .72rem; color: var(--muted); margin-top: .1rem;
    }
    .w-link-arrow {
      margin-left: auto; font-size: 1.1rem; color: var(--muted); flex-shrink: 0;
    }

    /* Stat */
    .w-stat {
      display: flex; align-items: center; gap: 1.25rem;
      padding: 1.1rem 1.5rem;
    }
    .w-stat-num {
      font-family: 'Fraunces', serif; font-size: 2.2rem;
      font-weight: 700; color: var(--accent2); line-height: 1;
    }
    .w-stat-label { font-size: .85rem; color: var(--muted); }
    .w-stat-desc { font-size: .78rem; color: var(--muted); margin-top: .2rem; }

    /* Section widget */
    .w-section-link {
      display: flex; align-items: center; gap: .85rem;
      padding: .9rem 1.25rem;
    }
    .w-section-num {
      font-family: 'Fraunces', serif; font-size: .8rem;
      color: var(--muted); width: 28px; flex-shrink: 0;
    }
    .w-section-title {
      font-family: 'Fraunces', serif; font-size: .95rem;
      font-weight: 700; color: var(--accent2); flex: 1;
    }
    .w-section-count {
      font-size: .7rem; color: var(--muted);
      background: var(--bg3); border-radius: 20px;
      padding: .15rem .5rem;
    }

    /* SIZE badges */
    .size-full  { grid-column: 1 / -1; }
    .size-half  { /* natural */ }
    .size-third { /* natural */ }
    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: .85rem;
    }

    /* ── EMPTY ── */
    .empty-state {
      text-align: center; padding: 3rem 1rem; color: var(--muted);
    }
    .empty-state span { font-size: 2.5rem; display: block; margin-bottom: .75rem; }
  `;

  /* ══════════════════════════════════════════════════════════
     PREVIEW: MÓDULOS (idéntico al sitio)
  ══════════════════════════════════════════════════════════ */
  const ModulesPreview = createClass({
    getInitialState: function() { return { open: {} }; },
    toggleCard: function(id) {
      this.setState(function(s) {
        const o = Object.assign({}, s.open);
        o[id] = !o[id];
        return { open: o };
      });
    },
    render: function() {
      const entry = this.props.entry;
      const modules = entry.getIn(['data', 'modules']);
      const pageKey = entry.getIn(['data', 'page_key']) || 'Módulos';
      const self = this;

      if (!modules || modules.size === 0) {
        return h('div', { className: 'empty-state' },
          h('span', {}, '📭'),
          h('p', {}, 'Sin módulos todavía. Usa el formulario de la izquierda para agregar.')
        );
      }

      const modArray = modules.toJS ? modules.toJS() : [];

      return h('div', {},
        h('div', { className: 'page-header' },
          h('div', { className: 'ph-icon' }, modArray[0] ? modArray[0].emoji || '📦' : '📦'),
          h('div', {},
            h('p', { className: 'page-label' }, pageKey),
            h('h1', {}, 'Vista previa')
          )
        ),
        h('div', { className: 'modules-grid' },
          modArray.map(function(mod, i) {
            const files = mod.files || [];
            const isOpen = !!self.state.open[mod.id || i];
            const pct = files.length ? 0 : 0;

            return h('div', {
              key: i,
              className: 'module-card' + (isOpen ? ' open' : ''),
              onClick: function() { self.toggleCard(mod.id || i); }
            },
              h('div', { className: 'mc-head' },
                h('div', {
                  className: 'mc-emoji',
                  style: { background: mod.bg || '#e4ecf7' }
                }, mod.emoji || '📁'),
                h('div', { className: 'mc-title-wrap' },
                  h('div', { className: 'mc-title' }, mod.title || '(sin título)'),
                  mod.desc ? h('div', { className: 'mc-desc' }, mod.desc) : null
                ),
                h('span', { className: 'mod-count' }, files.length + ' archivo' + (files.length !== 1 ? 's' : '')),
                h('span', { style: { fontSize: '.65rem', color: 'var(--muted)', marginLeft: '.3rem', transition: 'transform .25s', transform: isOpen ? 'rotate(90deg)' : 'none' } }, '▶')
              ),
              h('div', { className: 'mc-prog' },
                h('div', { className: 'mc-prog-fill', style: { width: pct + '%' } })
              ),
              isOpen
                ? (files.length > 0
                    ? h('div', { className: 'mc-files' },
                        files.map(function(f, fi) {
                          return h('div', { key: fi, className: 'file-card' },
                            h('div', { className: 'fc-icon', style: { background: mod.bg || '#e4ecf7' } }, mod.emoji || '📄'),
                            h('div', { className: 'fc-body' },
                              h('div', { className: 'fc-name' }, f.n || f.name || 'Archivo'),
                              h('div', {},
                                h('span', { className: 'fc-tag' }, f.type || 'PDF'),
                                f.ext ? h('span', { className: 'fc-ext' }, '↗ ext') : null
                              )
                            )
                          );
                        })
                      )
                    : h('p', { className: 'no-files' }, 'Sin archivos en este módulo.')
                  )
                : null
            );
          })
        )
      );
    }
  });

  /* ══════════════════════════════════════════════════════════
     PREVIEW: WIDGETS DEL INICIO
  ══════════════════════════════════════════════════════════ */
  const WidgetsPreview = createClass({
    render: function() {
      const entry = this.props.entry;
      const widgets = entry.getIn(['data', 'widgets']);

      if (!widgets || widgets.size === 0) {
        return h('div', { className: 'empty-state' },
          h('span', {}, '🧩'),
          h('p', {}, 'Sin widgets todavía. Agrega uno con el botón "Agregar widgets".')
        );
      }

      const arr = widgets.toJS ? widgets.toJS() : [];

      return h('div', {},
        h('p', { className: 'preview-section-label' }, '🧩 Widgets del inicio · ' + arr.length + ' widget' + (arr.length !== 1 ? 's' : '')),
        h('div', { className: 'widgets-grid' },
          arr.map(function(w, i) {
            const isFull = w.size === 'full';
            return h('div', {
              key: i,
              className: 'widget-card' + (isFull ? ' size-full' : ''),
              style: isFull ? { gridColumn: '1 / -1' } : {}
            },
              h('span', { className: 'widget-type-badge' }, w.type || 'widget'),
              renderWidget(w)
            );
          })
        )
      );
    }
  });

  function renderWidget(w) {
    switch(w.type) {
      case 'banner':
        return h('div', { className: 'w-banner' },
          h('div', { className: 'w-banner-title' }, w.title || 'Anuncio'),
          w.text ? h('p', { className: 'w-banner-text' }, w.text) : null,
          w.link_url ? h('a', { className: 'w-banner-link', href: w.link_url }, '→ ' + (w.link_label || w.link_url)) : null
        );

      case 'link':
        return h('div', { className: 'w-link' },
          h('div', { className: 'w-link-icon' }, w.emoji || '🔗'),
          h('div', {},
            h('div', { className: 'w-link-title' }, w.title || 'Enlace'),
            h('div', { className: 'w-link-url' }, w.url || '')
          ),
          h('span', { className: 'w-link-arrow' }, '↗')
        );

      case 'stat':
        return h('div', { className: 'w-stat' },
          h('div', { className: 'w-stat-num' }, w.number || '0'),
          h('div', {},
            h('div', { className: 'w-stat-label' }, w.label || 'Estadística'),
            w.desc ? h('div', { className: 'w-stat-desc' }, w.desc) : null
          )
        );

      case 'section':
        return h('div', { className: 'w-section-link' },
          h('span', { className: 'w-section-num' }, w.num || ''),
          h('span', { className: 'w-section-title' }, w.title || 'Sección'),
          w.total ? h('span', { className: 'w-section-count' }, w.total + ' archivos') : null
        );

      default:
        return h('div', { style: { padding: '1rem', color: 'var(--muted)', fontSize: '.82rem' } },
          'Widget: ' + (w.type || 'desconocido')
        );
    }
  }

  /* ══════════════════════════════════════════════════════════
     PREVIEW: SECCIONES DEL INICIO
  ══════════════════════════════════════════════════════════ */
  const SectionsPreview = createClass({
    render: function() {
      const data = this.props.entry.getIn(['data', 'sections']);
      if (!data || data.size === 0) {
        return h('div', { className: 'empty-state' }, h('span', {}, '🏠'), h('p', {}, 'Sin secciones.'));
      }
      const arr = data.toJS ? data.toJS() : [];
      return h('div', {},
        h('p', { className: 'preview-section-label' }, '🏠 Tarjetas de inicio · ' + arr.length + ' secciones'),
        h('div', { className: 'sections-grid' },
          arr.map(function(s, i) {
            return h('div', { key: i, className: 'section-card' },
              h('div', { className: 'sc-num' }, s.num || ''),
              h('div', { className: 'sc-title' }, s.title || ''),
              h('div', { className: 'sc-total' }, s.total ? s.total + ' archivos' : ''),
              s.img ? h('img', { className: 'sc-img', src: '/' + s.img, alt: '' }) : null
            );
          })
        )
      );
    }
  });

  /* ══════════════════════════════════════════════════════════
     PREVIEW: NAVEGACIÓN
  ══════════════════════════════════════════════════════════ */
  const NavPreview = createClass({
    render: function() {
      const data = this.props.entry.get('data');
      if (!data) return h('div', { className: 'empty-state' }, h('span', {}, '🔗'), h('p', {}, 'Sin datos.'));
      const d = data.toJS ? data.toJS() : {};
      const nav = d.nav_principal || [];
      const secs = d.secciones_material || [];

      return h('div', {},
        h('p', { className: 'preview-section-label' }, '🔗 Menú principal'),
        h('div', { style: { display: 'flex', gap: '.5rem', flexWrap: 'wrap', marginBottom: '1.5rem' } },
          nav.map(function(item, i) {
            return h('div', {
              key: i,
              style: {
                background: 'var(--bg2)', border: '1px solid var(--border)',
                borderRadius: '8px', padding: '.35rem .85rem',
                fontSize: '.82rem', color: 'var(--accent2)', fontWeight: '500'
              }
            }, (item.emoji || '') + ' ' + (item.label || item.href || ''));
          })
        ),
        h('p', { className: 'preview-section-label' }, '📋 Secciones del sidebar (' + secs.length + ')'),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '.35rem' } },
          secs.map(function(s, i) {
            return h('div', {
              key: i,
              style: {
                background: 'var(--bg2)', border: '1px solid var(--border)',
                borderRadius: '9px', padding: '.42rem .85rem',
                fontSize: '.8rem', color: 'var(--muted)',
                display: 'flex', alignItems: 'center', gap: '.5rem'
              }
            },
              h('span', {}, s.emoji || ''),
              h('span', { style: { color: 'var(--text)' } }, s.label || ''),
              h('span', { style: { marginLeft: 'auto', fontSize: '.7rem', opacity: '.6' } }, s.href || '')
            );
          })
        )
      );
    }
  });

  /* ══════════════════════════════════════════════════════════
     PREVIEW: HORARIO
  ══════════════════════════════════════════════════════════ */
  const SchedulePreview = createClass({
    render: function() {
      const data = this.props.entry.get('data');
      if (!data) return h('div', { className: 'empty-state' }, h('span', {}, '📅'), h('p', {}, 'Sin datos.'));
      const d = data.toJS ? data.toJS() : {};
      const rows = d.rows || [];
      const days = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

      return h('div', {},
        h('div', {
          style: {
            background: 'var(--bg2)', border: '1px solid var(--border)',
            borderRadius: '14px', padding: '1rem 1.25rem', marginBottom: '1rem'
          }
        },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '.75rem' } },
            h('span', { style: { fontFamily: "'Fraunces',serif", fontWeight: '700', color: 'var(--accent)', fontSize: '.95rem' } }, d.title || 'Horario'),
            h('span', { style: { fontSize: '.72rem', color: 'var(--muted)', background: 'var(--bg3)', borderRadius: '20px', padding: '.18rem .65rem' } }, d.dates || '')
          ),
          h('div', { style: { display: 'grid', gridTemplateColumns: '3rem repeat(7,1fr)', gap: '3px' } },
            h('div', {}),
            days.map(function(d, i) {
              return h('div', {
                key: i,
                style: { fontSize: '.62rem', fontWeight: '700', color: 'var(--muted)', textAlign: 'center', textTransform: 'uppercase', letterSpacing: '.04em' }
              }, d);
            }),
            rows.map(function(row, ri) {
              const cells = row.cells || Array(7).fill({});
              return h('div', { key: ri, style: { display: 'contents' } },
                h('div', { style: { fontSize: '.65rem', color: 'var(--muted)', fontWeight: '600', display: 'flex', alignItems: 'center' } }, row.time || ''),
                cells.slice(0, 7).map(function(cell, ci) {
                  const hasContent = cell && cell.subject;
                  return h('div', {
                    key: ci,
                    style: {
                      borderRadius: '6px', padding: '.3rem .1rem',
                      fontSize: '.6rem', fontWeight: '700', textAlign: 'center',
                      lineHeight: '1.2', color: hasContent ? '#fff' : 'transparent',
                      background: hasContent ? 'rgba(30,90,180,.7)' : 'var(--bg3)',
                      minHeight: '2rem', display: 'flex', flexDirection: 'column',
                      alignItems: 'center', justifyContent: 'center', gap: '.1rem'
                    }
                  },
                    hasContent ? h('span', {}, cell.subject) : null,
                    hasContent && cell.subtitle ? h('span', { style: { opacity: '.8', fontWeight: '400', fontSize: '.54rem' } }, cell.subtitle) : null
                  );
                })
              );
            })
          )
        )
      );
    }
  });

  /* ══════════════════════════════════════════════════════════
