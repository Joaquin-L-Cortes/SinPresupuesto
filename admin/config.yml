backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/SinPresupuesto
  branch: main

media_folder: "logos"
public_folder: "logos"

collections:

  # ── Metadatos de página (title + description) ──────────────────────
  - name: "page_meta"
    label: "Metadatos de páginas"
    description: "Títulos y descripciones SEO de cada página"
    files:
      - name: "index"
        label: "Inicio"
        file: "_data/page_meta.json"
        fields:
          - label: "Páginas"
            name: "pages"
            widget: "list"
            fields:
              - { label: "Archivo HTML", name: "file", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }

  # ── Secciones del índice ────────────────────────────────────────────
  - name: "index_sections"
    label: "Secciones del índice"
    files:
      - name: "sections"
        label: "Todas las secciones"
        file: "_data/index_sections.json"
        fields:
          - label: "Secciones"
            name: "sections"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "desc", widget: "text" }
              - { label: "URL", name: "href", widget: "string" }
              - { label: "Color de fondo", name: "bg", widget: "color" }

  # ── Cronograma del índice ───────────────────────────────────────────
  - name: "index_schedule"
    label: "Cronograma (Horario)"
    files:
      - name: "schedule"
        label: "Horario semanal"
        file: "_data/index_schedule.json"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Fechas (texto)", name: "dates", widget: "string" }
          - label: "Filas del horario"
            name: "rows"
            widget: "list"
            fields:
              - { label: "Hora", name: "time", widget: "string" }
              - { label: "Lunes", name: "mon", widget: "string", required: false }
              - { label: "Martes", name: "tue", widget: "string", required: false }
              - { label: "Miércoles", name: "wed", widget: "string", required: false }
              - { label: "Jueves", name: "thu", widget: "string", required: false }
              - { label: "Viernes", name: "fri", widget: "string", required: false }
              - { label: "Sábado", name: "sat", widget: "string", required: false }
              - { label: "Domingo", name: "sun", widget: "string", required: false }

  # ── Módulos de contenido (una colección por página) ─────────────────
  - name: "relampago"
    label: "I. Relámpago 2026"
    files:
      - name: "relampago"
        label: "Módulos"
        file: "_data/relampago-sinpre.json"
        fields:
          - { label: "Page key", name: "page_key", widget: "hidden" }
          - label: "Módulos"
            name: "modules"
            widget: "list"
            fields: &module_fields
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Color de fondo", name: "bg", widget: "color" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "desc", widget: "text" }
              - label: "Archivos"
                name: "files"
                widget: "list"
                fields:
                  - { label: "Nombre", name: "n", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Tipo", name: "type", widget: "select", options: ["PDF", "Video", "Enlace", "Drive", "ZIP"] }
                  - { label: "Externo", name: "ext", widget: "boolean", default: false }

  - name: "exclusivos"
    label: "II. Exclusivos SinPre"
    files:
      - name: "exclusivos"
        label: "Módulos"
        file: "_data/formulario-economico-1.json"
        fields:
          - { label: "Page key", name: "page_key", widget: "hidden" }
          - label: "Módulos"
            name: "modules"
            widget: "list"
            fields: *module_fields

  - name: "temarios"
    label: "III. Temarios"
