backend:
  name: github
  repo: Joaquin-L-Cortes/SinPresupuesto
  branch: main
  base_url: https://sinpresupuesto-api.jocortesca.workers.dev
  auth_endpoint: /auth

media_folder: "logos"
public_folder: "logos"

collections:

  # ── NAVEGACION — control total desde el CMS ─────────────────────────
  - name: "navegacion"
    label: "Navegacion"
    description: "Controla el menu principal y las secciones de material del sidebar"
    files:
      - name: "nav"
        label: "Menu y Secciones"
        file: "_data/nav.json"
        fields:
          - label: "Menu principal (barra de navegacion)"
            name: "nav_principal"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.label}}"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Texto del enlace", name: "label", widget: "string" }
              - { label: "URL (ej: index.html)", name: "href", widget: "string" }
          - label: "Secciones de material (sidebar y drawer)"
            name: "secciones_material"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.label}}"
            fields:
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Nombre de la seccion", name: "label", widget: "string" }
              - { label: "URL (ej: relampago-sinpre.html)", name: "href", widget: "string" }

  # ── PAGINAS — agregar, quitar y renombrar secciones ─────────────────
  - name: "paginas"
    label: "Paginas de modulos"
    description: "Define que paginas de modulos existen, su nombre, emoji e intro"
    files:
      - name: "pages"
        label: "Lista de paginas"
        file: "_data/pages.json"
        fields:
          - label: "Modulos"
            name: "modulos"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.title}}"
            fields:
              - { label: "Slug (ej: relampago-sinpre)", name: "slug", widget: "string" }
              - { label: "Titulo corto", name: "title", widget: "string" }
              - { label: "Titulo SEO", name: "meta_title", widget: "string" }
              - { label: "Descripcion SEO", name: "meta_desc", widget: "text" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Etiqueta (ej: Seccion I)", name: "label", widget: "string" }
              - { label: "Intro (descripcion corta)", name: "intro", widget: "text" }
              - { label: "Archivo de datos (ej: relampago-sinpre.json)", name: "data_file", widget: "string" }
              - { label: "Page key (ej: relampago_sinpre)", name: "page_key", widget: "string" }

  # ── SECCIONES DEL INICIO ─────────────────────────────────────────────
  - name: "index_sections"
    label: "Secciones del inicio"
    files:
      - name: "sections"
        label: "Tarjetas de secciones"
        file: "_data/index_sections.json"
        fields:
          - label: "Secciones"
            name: "sections"
            widget: "list"
            summary: "{{fields.emoji}} {{fields.title}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion", name: "desc", widget: "text" }
              - { label: "URL", name: "href", widget: "string" }
              - { label: "Color de fondo", name: "bg", widget: "color" }

  # ── CRONOGRAMA DEL INICIO ────────────────────────────────────────────
  - name: "index_schedule"
    label: "Horario semanal"
    files:
      - name: "schedule"
        label: "Horario"
        file: "_data/index_schedule.json"
        fields:
          - { label: "Titulo", name: "title", widget: "string" }
          - { label: "Fechas (texto)", name: "dates", widget: "string" }
          - label: "Filas del horario"
            name: "rows"
            widget: "list"
            fields:
              - { label: "Hora", name: "time", widget: "string" }
              - { label: "Lunes", name: "mon", widget: "string", required: false }
              - { label: "Martes", name: "tue", widget: "string", required: false }
              - { label: "Miercoles", name: "wed", widget: "string", required: false }
              - { label: "Jueves", name: "thu", widget: "string", required: false }
              - { label: "Viernes", name: "fri", widget: "string", required: false }
              - { label: "Sabado", name: "sat", widget: "string", required: false }
              - { label: "Domingo", name: "sun", widget: "string", required: false }

  # ── MODULOS DE CONTENIDO ─────────────────────────────────────────────
  - name: "relampago"
    label: "I. Relampago 2026"
    files:
      - name: "relampago"
        label: "Modulos"
        file: "_data/relampago-sinpre.json"
        fields:
          - { label: "Page key", name: "page_key", widget: "hidden" }
          - label: "Modulos"
            name: "modules"
            widget: "list"
            fields: &module_fields
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Emoji", name: "emoji", widget: "string" }
              - { label: "Color de fondo", name: "bg", widget: "color" }
              - { label: "Titulo", name: "title", widget: "string" }
              - { label: "Descripcion", name: "desc", widget: "text" }
              - label: "Archivos"
                name: "files"
                widget: "list"
                fields:
                  - { label: "Nombre", name: "n", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Tipo", name: "type", widget: "select", options: ["PDF", "Video", "Enlace", "Drive", "ZIP"] }
                  - { label: "Externo", name: "ext", widget: "boolean", default: false }

  - name: "exclusivos"
    label: "II. Exclusivos SinPre"
    files:
      - name: "exclusivos"
        label: "Modulos"
        file: "_data/formulario-economico-1.json"
        fields:
          - { label: "Page key", name: "page_key", widget: "hidden" }
          - label: "Modulos"
            name: "modules"
            widget: "list"
            fields: *module_fields

  - name: "temarios"
    label: "III. Temarios"
    files:
      - name: "temarios"
        label: "Modulos"
        file: "_data/temarios.json"
        fields:
          - { label: "Page key", name: "page_key", widget: "hidden" }
